schema_version = 1
contract = "project-structure"
requirement_ids = ["PRS-001", "PRS-002", "PRS-003", "PRS-004", "PRS-005", "PRS-006", "PRS-007", "PRS-009", "PRS-010", "PRS-011", "PRS-012", "PRS-013", "PRS-014", "PRS-015", "PRS-016", "PRS-017", "PRS-018", "PRS-019", "PRS-020"]

[upstream_gitlink]
path = "deerflow"
commit = "66b9e7f21212490cf92fafac137542b9deb06615"

[guide]
path = "deep_research_harness/AGENTS.md"
begin_marker = "<!-- BEGIN GENERATED: PROJECT-STRUCTURE -->"
end_marker = "<!-- END GENERATED: PROJECT-STRUCTURE -->"

[package]
source_root = "deep_research_harness/src/deerflow_deep_research"
fixture_root = "deep_research_harness/src_fake/deerflow_deep_research_fixtures"
fixture_package = "deerflow_deep_research_fixtures"
test_root = "deep_research_harness/tests"
ownership_layers = ["runtime", "domain", "engine", "agents", "graph"]
forbidden_source_roots = ["backend", "frontend"]
forbidden_shared_modules = ["utils", "helpers", "common"]

[fixture_imports]
production_contracts = [
  "deerflow_deep_research.domain.bundle",
  "deerflow_deep_research.domain.failure_codes",
  "deerflow_deep_research.domain.gate",
  "deerflow_deep_research.domain.invocation",
  "deerflow_deep_research.domain.lifecycle",
  "deerflow_deep_research.domain.node_spec",
  "deerflow_deep_research.domain.state",
  "deerflow_deep_research.domain.work_units",
  "deerflow_deep_research.engine.work_units.kernel",
  "deerflow_deep_research.engine.work_units.validation",
  "deerflow_deep_research.graph.components.work_units",
  "deerflow_deep_research.graph.implementation_map",
  "deerflow_deep_research.graph.topology",
]
external_namespaces = ["pydantic", "langgraph"]
recipe_class = "deerflow_deep_research.runtime.research.ResearchGraphRecipe"
recipe_factories = ["from_adapters"]

[ignored_paths]
path = "deep_research_harness/.gitignore"
entries = [".deep-research-demo-runs/", ".reports/", ".pytest_cache/", ".ruff_cache/", ".node-prompt-review/", "evals/runs/", ".venv/", ".agents/", ".claude/", ".repro-tmp/"]

[inventory]
path = "openspec/governance/required-paths.toml"

# Import-boundary keys: the six import layers (including `nodes`, the graph-owned
# node-package import sub-layer). External namespaces are TOML-authorized per layer;
# internal-layer import directions are fixed and enforced by the checker.
[imports]
domain = ["stdlib", "pydantic"]
engine = ["domain"]
agents = ["domain", "deerflow", "langchain"]
graph = ["domain", "engine", "nodes", "langgraph"]
nodes = ["domain", "engine", "langgraph", "pydantic"]
runtime = ["domain", "graph", "agents", "deerflow", "httpx", "httpx_sse", "langchain", "langgraph", "openai"]

[node_packages]
root = "deep_research_harness/src/deerflow_deep_research/graph/nodes"
required_files = ["__init__.py", "node.py", "contracts.py"]
optional_files = ["subgraph.py", "capabilities.py"]
forbidden_files = ["fake.py"]
public_export = "NODE_SPEC"
