name: Deep Research Entry Environment Regression

on:
  pull_request:
    paths:
      - "deep_research_harness/Makefile"
      - "deep_research_harness/pyproject.toml"
      - "deep_research_harness/uv.lock"
      - "deep_research_harness/run/**"
      - "deep_research_harness/scripts/**"
      - "deep_research_harness/src/**"
      - "deep_research_harness/src_fixtures/**"
      - "deep_research_harness/tests/scenarios_periodic/**"
      - ".github/workflows/agent-entry-environment-regression.yml"
  push:
    branches: [master]
    paths:
      - "deep_research_harness/Makefile"
      - "deep_research_harness/pyproject.toml"
      - "deep_research_harness/uv.lock"
      - "deep_research_harness/run/**"
      - "deep_research_harness/scripts/**"
      - "deep_research_harness/src/**"
      - "deep_research_harness/src_fixtures/**"
      - "deep_research_harness/tests/scenarios_periodic/**"
      - ".github/workflows/agent-entry-environment-regression.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entry-environment-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deep_research_harness
    steps:
      # deerflow 是 gitlink 子模块（install 步骤的 editable 依赖在其内）；
      # 默认 checkout 不拉子模块——CI 自工作流创建起一直死在安装步（2026-09-28 审计发现）。
      - uses: actions/checkout@v4
        with:
          submodules: true
      # uv 缓存显式开启（与 agent-tests.yml 一致）：install 冷缓存 → 命中后 ~30s，
      # 且 UV_OFFLINE=1 依赖 install 预热后的本地缓存。
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "deep_research_harness/uv.lock"
          prune-cache: false
      - run: make install
      - run: UV_OFFLINE=1 make test-entry-environment-regression
