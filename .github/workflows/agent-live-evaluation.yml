name: Deep Research Live Evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run bounded live evaluation
        working-directory: deep_research_harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          uv sync --locked --extra operations
          uv run --extra operations python scripts/live_preflight.py --require-web
          make test-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-research-live-evaluation
          path: deep_research_harness/.reports/live
