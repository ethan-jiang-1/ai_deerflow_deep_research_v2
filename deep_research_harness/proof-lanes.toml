# Delivery lanes owned by the application: which harness command proves which harness surface.
# Governance-side evidence (doc hygiene, the OpenSpec gate) stays with the governance tree;
# the application must not depend on it (see change add-evidence-receipts-and-proof-lanes).
# Surfaces are repository-root-relative globs; `sentinel` is the string a green run prints.
version = 1

[[lane]]
name = "verify"
command = "make verify"
cwd = "deep_research_harness"
tier = "fast"
sentinel = "verify: OK"
surfaces = [
  "deep_research_harness/src/**",
  "deep_research_harness/src_fixtures/**",
  "deep_research_harness/scripts/**",
  "deep_research_harness/tests/**",
  "deep_research_harness/Makefile",
  "deep_research_harness/pyproject.toml",
]

[[lane]]
name = "debugger-proof"
command = "make debugger-proof"
cwd = "deep_research_harness"
tier = "full"
sentinel = "debugger-proof: every lane exited 0"
journeys = ["E1", "E2", "E4", "E5", "E6", "E7", "E8", "E9", "E10", "E11", "E12", "E13", "E14", "E15"]
surfaces = [
  "deep_research_harness/scripts/demo_tui.py",
  "deep_research_harness/scripts/tui_journey_probe.py",
  "deep_research_harness/scripts/tui_experience_suite.py",
  "deep_research_harness/src/deerflow_deep_research/domain/debug_driving.py",
  "deep_research_harness/src/deerflow_deep_research/runtime/debug_driver.py",
  "deep_research_harness/tests/integration/test_demo_tui.py",
  "deep_research_harness/tests/integration/test_debug_driver_matrix.py",
  "deep_research_harness/tests/integration/test_debugger_entry.py",
  "deep_research_harness/docs/runbooks/runbook-03*.md",
]
